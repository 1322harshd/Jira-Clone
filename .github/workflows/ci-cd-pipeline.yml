name: CI/CD pipeline

on: push

jobs:
    eslint:
        name: Run ESLint
        runs-on: ubuntu-latest

        steps: 
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '22'
                cache: 'npm'
            - name: Install Dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint:ci

            - name: Upload Lint Report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                name: eslint-report
                path: eslint-report.html
                retention-days: 5

    test:
      name: Run Tests
      runs-on: ubuntu-latest
      needs: eslint
      services:
        postgres:
          image: postgres:16
          env:
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: jira_test
          ports: ['5431:5432']
          options: >-
            --health-cmd pg_isready --health-interval 5s
            --health-timeout 5s --health-retries 10
      env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5431/jira_test
            JWT_SECRET: test-secret
            JWT_REFRESH_SECRET: test-refresh-secret
            NODE_ENV: test
      steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '22'
                cache: 'npm'
            - name: Install Dependencies
              run: npm ci
            - name: Create Migrations
              run: npx prisma generate
            - name: Run Tests
              run: npm test

    build:
      name: Build Docker Image
      runs-on: ubuntu-latest
      needs: test
      permissions:
        id-token: write
        contents: read
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Configure AWS Credentials
          if: github.ref == 'refs/heads/main'
          uses: aws-actions/configure-aws-credentials@v4
          with: 
            role-to-assume: arn:aws:iam::013364996908:role/github-ecr-push-role
            aws-region: ap-southeast-2
        - name: Log in to ECR
          if: github.ref == 'refs/heads/main'
          id: ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: Build Image
          run: docker build -t jira-clone:${{ github.sha }} .
        
        - name: Push Image
          if: github.ref == 'refs/heads/main'
          run: |
            docker tag jira-clone:${{ github.sha }} ${{ steps.ecr.outputs.registry }}/prod/jira_clone:${{ github.sha }}
            docker push ${{ steps.ecr.outputs.registry }}/prod/jira_clone:${{ github.sha }}
    
    deploy:
      name: Deploy to ECS
      runs-on: ubuntu-latest
      needs: build
      if: github.ref == 'refs/heads/main'
      permissions:
        id-token: write
        contents: read
      env:
        TF_VAR_image_tag: ${{ github.sha }}
        TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
        TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
        TF_VAR_jwt_refresh_secret: ${{ secrets.JWT_REFRESH_SECRET}}
        TF_VAR_cloudinary_url: ${{ secrets.CLOUDINARY_URL }}
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4
          
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '22'
            cache: 'npm'
        
        - name: Install Dependencies
          run: npm ci

        - name : Run Migrations
          run: npx prisma migrate deploy
          env:
            DATABASE_URL: ${{ secrets.DATABASE_URL }}

        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: arn:aws:iam::013364996908:role/github-ecr-push-role
            aws-region: ap-southeast-2
        
        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v3

        - name: Terraform Init
          working-directory: infra
          run: terraform init -input=false

        - name: Terraform Apply
          working-directory: infra
          run: terraform apply -auto-approve -input=false
          

        
      

           